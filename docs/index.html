<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf8f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="せかいのことば">
<style>:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); } body { margin: 0; }</style>
<title>せかいのことば</title>
<meta name="description" content="韓国語・英語・ドイツ語の文字の読み方から単語・かんたんな文まで。音を聞いて、まねして言ってみる語学アプリ。なに語?クイズつき">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Noto+Sans+KR:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* レイアウト: 旅のノート。あたたかい紙色に、言語ごとの色をアクセントに使う */
:root {
  --bg: #fdf8f1;
  --card: #ffffff;
  --ink: #2b2a33;
  --sub: #6b6876;
  --line: #ebe3d6;
  --accent: #1f5fae;      /* 韓国語の青(言語ごとに --lc で上書き) */
  --red: #d23c4a;
  --ok: #2e8a5c;
  --ng: #c63d4f;
  --cC: #1f5fae;          /* 子音 */
  --cV: #d23c4a;          /* 母音 */
  --cP: #2e8a5c;          /* パッチム */
  --display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --r: 14px;
  color-scheme: light;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.65; -webkit-tap-highlight-color: transparent; }
#app { max-width: 640px; margin: 0 auto; padding: 14px 16px 96px; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; }
h2 { font-size: 26px; } h3 { font-size: 18px; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--sub); } .small { font-size: 13px; } .num { font-variant-numeric: tabular-nums; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.link { background: none; border: 0; color: var(--accent); padding: 8px 0; font-weight: 700; }
.track { display: block; height: 8px; border-radius: 4px; background: #efe7da; overflow: hidden; }
.track > i { display: block; height: 100%; background: var(--accent); }
.cC { color: var(--cC); } .cV { color: var(--cV); } .cP { color: var(--cP); }
.tl { font-weight: 700; }
.tl.mid { font-size: 24px; }
.warn { background: #fff1d6; border: 1px solid #f0d08a; border-radius: var(--r); padding: 12px 14px; font-size: 14px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.primary { border: 0; border-radius: var(--r); background: var(--accent); color: #fff; font-weight: 700; padding: 14px; font-size: 17px; }
.primary:disabled { opacity: .4; }
.primary.sticky { position: sticky; bottom: 14px; box-shadow: 0 6px 18px rgba(31,95,174,.3); }
.ghost { border: 1px solid var(--line); border-radius: var(--r); background: var(--card); padding: 12px; font-weight: 700; }

/* ホーム */
.mast { display: grid; gap: 4px; padding-top: 8px; }
.mast .eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--sub); }
.mast h1 { font-size: clamp(36px, 11vw, 54px); line-height: 1.1; }
.mast h1 span { color: var(--red); }
.langs { display: grid; gap: 12px; }
.langcard { text-align: left; border: 1px solid var(--line); border-left: 8px solid var(--lc); border-radius: var(--r); background: var(--card); padding: 16px; display: grid; gap: 6px; }
.langcard .hello { font-size: 30px; font-weight: 700; color: var(--lc); }
.langcard .track > i { background: var(--lc); }
.langcard b { font-size: 18px; } .langcard b small { font-weight: 400; color: var(--sub); margin-left: 6px; }
.foot { margin-top: 12px; }

/* 言語のメニュー */
.lh { border-left: 6px solid var(--lc); padding-left: 10px; }
.mission { display: grid; gap: 4px; text-align: left; padding: 16px; border-radius: var(--r); border: 0; background: var(--red); color: #fff; }
.mission b { font-family: var(--display); font-size: 20px; } .mission span { font-size: 13px; }
.group { display: grid; gap: 8px; }
.units { display: grid; gap: 8px; }
.unit { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
.unit span:first-child { display: grid; min-width: 0; } .unit small { color: var(--sub); font-size: 12px; }
.unit .pct { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ハングルのしくみ */
.blks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.blk { display: grid; justify-items: center; gap: 2px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
.blk .big { font-size: 56px; line-height: 1.1; font-weight: 700; }
.blk .eq { font-size: 20px; } .blk .eq i { font-style: normal; font-weight: 700; }
.inl { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 2px 8px; font-weight: 700; }

/* 見て聞く */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.card { display: grid; justify-items: center; align-content: start; gap: 2px; text-align: center; padding: 12px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
.card .big { font-size: 52px; line-height: 1.15; font-weight: 700; color: var(--accent); }
.cmp { display: grid; gap: 8px; } .cmp div { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cmp button { font-size: 30px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.grid-wrap { overflow-x: auto; }
.hb { border-collapse: collapse; width: 100%; table-layout: fixed; }
.hb th { font-size: 16px; padding: 2px 0; width: auto; } .hb tr > th:first-child { width: 22px; }
.hb td { padding: 1px; }
.hb td button { width: 100%; font-size: clamp(14px, 4.6vw, 22px); padding: 5px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.list { display: grid; gap: 10px; }
.row { display: grid; gap: 4px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
.rt { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.says { display: inline-flex; gap: 6px; }
.say { border: 1px solid var(--line); background: #f4f0e8; border-radius: 10px; padding: 4px 10px; font-size: 18px; }
.gloss { display: flex; flex-wrap: wrap; gap: 6px; }
.gloss span { display: grid; justify-items: center; padding: 4px 8px; border-radius: 10px; background: #f4f0e8; }
.gloss small { font-size: 11px; color: var(--sub); }
.mic { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.micbtn { border: 1px solid var(--accent); color: var(--accent); background: var(--card); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 700; }
.heard { font-size: 13px; } .heard.ok { color: var(--ok); font-weight: 700; } .heard.ng { color: var(--ng); }

/* クイズ */
.qcard { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
.qcard.center { text-align: center; }
.tag { justify-self: start; font-size: 12px; padding: 2px 10px; border-radius: 999px; background: #f4f0e8; color: var(--sub); }
.qtext { font-family: var(--display); font-size: 20px; font-weight: 800; }
.qbig { text-align: center; padding: 8px 0; } .qbig .tl { font-size: 72px; line-height: 1.2; color: var(--accent); }
.qbig .tl.long { font-size: 34px; }
.qhear { display: flex; justify-content: center; align-items: center; gap: 12px; }
.say.huge { font-size: 40px; padding: 10px 26px; border-radius: 18px; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); font-size: 17px; }
.choice.ok { border-color: var(--ok); background: #e7f5ee; } .choice.ng { border-color: var(--ng); background: #fbe9ec; }
.choice:disabled { cursor: default; }
.pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pick button { font-size: 30px; padding: 6px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); }
.pick button[aria-pressed="true"] { border-color: var(--accent); background: #e8f0fb; }
.built { text-align: center; } .built .tl { font-size: 64px; color: var(--accent); }
.line { min-height: 56px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; border: 2px dashed var(--line); border-radius: 12px; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; }
.tiles button, .line button { font-size: 20px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 10px; background: #f4f0e8; }
.verdict { display: grid; gap: 8px; padding: 12px 14px; border-radius: 12px; }
.verdict.ok { background: #e7f5ee; } .verdict.ng { background: #fbe9ec; }
.verdict > b { font-family: var(--display); font-size: 20px; } .verdict.ok > b { color: var(--ok); } .verdict.ng > b { color: var(--ng); }
.ans { display: grid; gap: 6px; }
#after { display: grid; gap: 10px; }
.score { font-family: var(--display); font-size: 56px; font-weight: 800; color: var(--accent); }
</style>
</head>
<body>
<div id="app"></div>
<script src="furi.js"></script>
<script src="data/ko.js"></script>
<script src="data/en.js"></script>
<script src="data/de.js"></script>
<script src="data/nanigo.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
